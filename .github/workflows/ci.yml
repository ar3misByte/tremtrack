name: CI
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size -w app

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck -w infra
      - name: Stack template and cloud path against local mocks
        run: npm run test -w infra
      - name: Synthesize (no AWS credentials needed)
        run: npm run cdk:synth

  detector-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Host simulator vs baseline (real sketch, g++)
        run: node tools/hostsim/run.mjs --check
      - name: Firmware cloud reporter vs the TypeScript reference
        run: npm run hostsim:cloud
      - name: Compass (calibration, drift, disturbance, mirrored mounting)
        run: node tools/hostsim/compass-check.mjs
      - name: Board mounting (!orient) and drift while still (!zupt)
        run: node tools/hostsim/orient-check.mjs

  firmware-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "SparkFun MAX3010x Pulse and Proximity Sensor Library" "NimBLE-Arduino" "WebSockets"
      - name: Compile (Bluetooth + WebSocket + compass, no cloud)
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings default firmware/tremor_monitor
      - name: Compile with the cloud code path (fake device_config.h, Huge APP partition)
        run: |
          cp firmware/tremor_monitor/device_config.example.h firmware/tremor_monitor/device_config.h
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --warnings default firmware/tremor_monitor

  # Browser tests: the app in headless Chromium against the host simulator, a fake Bluetooth headset and the local
  # mock of the cloud. (Written to match what runs locally; this job has not been seen green in CI yet.)
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the host simulator binaries the tests stream from
        run: |
          node tools/hostsim/run.mjs --check
          npm run hostsim:cloud
      - name: Start the app
        run: |
          nohup npm run dev -w app -- --port 5173 --strictPort > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5173/ > /dev/null && exit 0; sleep 1; done
          cat app.log; exit 1
      - name: Accessibility audit (axe, every screen, normal and large text)
        run: npm run a11y -w app
      - name: Browser flows
        run: |
          npm run e2e:local -w app
          npm run e2e:history -w app
          npm run e2e:log -w app
          npm run e2e:report -w app
          npm run e2e:fall -w app
          npm run e2e:device -w app
          npm run e2e:cloud -w app
